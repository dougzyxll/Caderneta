name: Gerar app Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Instalar dependências
        run: npm ci

      - name: Montar o app (www) e copiar para o Android
        run: |
          python3 scripts/build_www.py
          npx cap sync android

      - name: Preparar chave de assinatura
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Compilar APK de teste
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Compilar pacote da Play Store (AAB assinado)
        if: env.KEYSTORE_BASE64 != ''
        working-directory: android
        run: ./gradlew --no-daemon bundleRelease

      - name: Disponibilizar o APK para baixar no celular
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Caderneta.apk
          NOTES="Versão $VERSION_NAME. No celular, toque em Caderneta.apk para baixar e depois abra o arquivo para instalar. Versões novas instalam por cima e mantêm seus dados."
          if gh release view app >/dev/null 2>&1; then
            gh release edit app --notes "$NOTES"
          else
            gh release create app --prerelease --title "Caderneta para Android" --notes "$NOTES"
          fi
          gh release upload app Caderneta.apk --clobber

      - name: Publicar APK de teste
        uses: actions/upload-artifact@v4
        with:
          name: caderneta-teste-apk-${{ env.VERSION_NAME }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publicar AAB da Play Store
        if: env.KEYSTORE_BASE64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: caderneta-playstore-aab-${{ env.VERSION_NAME }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
